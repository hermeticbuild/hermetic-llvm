name: Native MSVC STL smoke
on:
  push:
    branches: [cerisier/msvc-stl-investigation]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            cpu: x86_64
          - runner: windows-11-arm
            cpu: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build and run the Microsoft STL executable
        working-directory: e2e/rules_cc
        shell: bash
        env:
          USE_BAZEL_VERSION: 9.3.2
          MSVCSTL_CPU: ${{ matrix.cpu }}
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          bazel run \
            --lockfile_mode=off \
            --remote_executor= \
            --remote_cache= \
            --experimental_remote_downloader= \
            --spawn_strategy=local \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            --features=-layering_check \
            --features=-dynamic_link_msvcrt \
            --features=static_link_msvcrt \
            "--platforms=@llvm//platforms:windows_${MSVCSTL_CPU}_msvc" \
            //msvcstl:main
