name: Flang Prebuilt Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "flang-<LLVM version>-r<revision>"
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: flang-prebuilt-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Require merged main and unused tag
        shell: bash
        env:
          FLANG_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Flang releases must be dispatched from merged main"
            exit 1
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${FLANG_RELEASE_TAG}" > /dev/null
          status=$?
          set -e
          case "${status}" in
            0)
              echo "::error::Release tag ${FLANG_RELEASE_TAG} already exists"
              exit 1
              ;;
            2) ;;
            *)
              echo "::error::Could not check release tag ${FLANG_RELEASE_TAG}"
              exit 1
              ;;
          esac

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/buildbuddy-api-key
        with:
          api-key: ${{ secrets.BUILDBUDDY_RELEASE_API_KEY }}
          required: true

      - name: Mount bazel caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo
          key: flang-prebuilt-bazel-${{ runner.os }}-${{ inputs.release_tag }}
          restore-keys: |
            flang-prebuilt-bazel-${{ runner.os }}

      - name: Build, test and package Flang
        id: build_and_package
        env:
          FLANG_RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash .github/workflows/flang-prebuilt.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flang-toolchain-${{ steps.build_and_package.outputs.version }}
          path: release/*

      - name: Attest release artifacts
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            release/*.tar.zst
            release/SHA256.txt

      - name: Normalize attestation bundle filename
        run: |
          mv \
            "${{ steps.attest.outputs.bundle-path }}" \
            "release/flang-toolchain-${{ steps.build_and_package.outputs.version }}.attestation.jsonl"

      - name: Upload attestation bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flang-toolchain-${{ steps.build_and_package.outputs.version }}.attestation
          path: release/flang-toolchain-${{ steps.build_and_package.outputs.version }}.attestation.jsonl
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ steps.build_and_package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Flang prebuilt ${{ steps.build_and_package.outputs.version }}
          files: |
            release/*.tar.zst
            release/SHA256.txt
            release/*.attestation.jsonl
          overwrite_files: false
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
