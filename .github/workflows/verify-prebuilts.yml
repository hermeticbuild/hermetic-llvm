name: Verify LLVM prebuilt releases

# Rebuilds LLVM prebuilt releases from their commits, bootstrapping from
# llvm-22.1.7-2, and compares the archives with the published ones. Only FDO
# training actions may use cached results, see verify.sh. Releases up to
# llvm-22.1.7-2 have been verified by an earlier run.

on:
  push:
    branches:
      - verify-prebuilts

permissions:
  contents: read

concurrency:
  group: verify-prebuilts
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # Bootstrapping from the original seed shows whether stage 2, and
          # thus the FDO training actions, depend on the seed.
          - tag: llvm-23.1.2-1
            sha: 90a3a2fc9a296146c9b054faf6a5ca807b0430f7
            keep_seed: 1
          - tag: llvm-22.1.8-1
            sha: e086af4b77f850070d7b5db3523aece3ac6ecf9a
            keep_seed: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: verify
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.sha }}
          path: src
          persist-credentials: false
      - name: Rebuild and compare
        working-directory: src
        env:
          TAG: ${{ matrix.tag }}
          KEEP_SEED: ${{ matrix.keep_seed }}
          VERIFY_DIR: ${{ github.workspace }}/verify
        run: bash "$VERIFY_DIR/.github/verify-prebuilts/verify.sh" "$TAG" llvm-22.1.5-1 llvm-22.1.6-1 llvm-22.1.7-1 llvm-22.1.7-2 "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rebuilt-${{ matrix.tag }}
          path: |
            src/release/
            ${{ runner.temp }}/exec_log.zst
          if-no-files-found: ignore
