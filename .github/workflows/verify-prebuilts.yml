name: Verify LLVM prebuilt releases

# Rebuilds LLVM prebuilt releases from their commits, bootstrapping from
# llvm-22.1.7-2, and compares the archives with the published ones. Only FDO
# training actions may use cached results, see verify.sh. Releases up to
# llvm-22.1.7-2 have been verified by an earlier run.

on:
  push:
    branches:
      - verify-prebuilts

permissions:
  contents: read

concurrency:
  group: verify-prebuilts
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - tag: llvm-23.1.2-1
            sha: 90a3a2fc9a296146c9b054faf6a5ca807b0430f7
          - tag: llvm-23.1.0-4
            sha: a8135d96191c856c45f6a64a1743a17e46a4baca
          - tag: llvm-22.1.8-2
            sha: e768d7589c1d0a6c6aa7aac61c24bd423a3e9efd
          - tag: llvm-23.1.0-3
            sha: ab6bd645c759585112fde74540b7ebeb26ac56a7
          - tag: llvm-23.1.0-2
            sha: 63757394db1e312b35ed98df4eb64f79fb38f908
          - tag: llvm-23.1.0-1
            sha: c872f50d272ae7c0a59f8f49c31fa6e1cad25f6f
          - tag: llvm-23.1.0-rc1-1
            sha: 627850996ab873cdb18d14c288304669ff6d2e12
          - tag: llvm-21.1.8-10
            sha: c6e45dfcb71009ac44b66386fe83e0e0b9cdfb2d
          - tag: llvm-22.1.8-1
            sha: e086af4b77f850070d7b5db3523aece3ac6ecf9a
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: verify
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.sha }}
          path: src
          persist-credentials: false
      - name: Rebuild and compare
        working-directory: src
        env:
          TAG: ${{ matrix.tag }}
          VERIFY_DIR: ${{ github.workspace }}/verify
        run: bash "$VERIFY_DIR/.github/verify-prebuilts/verify.sh" "$TAG" llvm-22.1.5-1 llvm-22.1.6-1 llvm-22.1.7-1 llvm-22.1.7-2 "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: rebuilt-${{ matrix.tag }}
          path: |
            src/release/
            ${{ runner.temp }}/exec_log.zst
          if-no-files-found: ignore
