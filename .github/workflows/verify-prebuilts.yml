          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: f9627ab7affb6a842c4eba58558291bdf299bcb6
          path: src
          persist-credentials: false
      - name: Rebuild and compare
        working-directory: src
        env:
          VERIFY_DIR: ${{ github.workspace }}/verify
        run: bash "$VERIFY_DIR/.github/verify-prebuilts/verify.sh" llvm-22.1.6-1 llvm-22.1.5-1 llvm-22.1.6-1 llvm-22.1.7-1 llvm-22.1.7-2 llvm-22.1.8-1 llvm-21.1.8-10 llvm-23.1.0-rc1-1 llvm-23.1.0-1 llvm-22.1.8-2 llvm-23.1.0-2 llvm-23.1.0-3 llvm-23.1.0-4 llvm-23.1.2-1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: rebuilt-llvm-22.1.6-1
          path: src/release/
          if-no-files-found: ignore

