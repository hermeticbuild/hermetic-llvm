name: Verify LLVM prebuilt releases

# Rebuilds each LLVM prebuilt release from its commit without accepting cached
# results and compares the archives with the published ones. Releases are
# verified in the order they were published, so the bootstrap seed of each
# release has been verified before it is rebuilt.

on:
  push:
    branches:
      - verify-prebuilts

permissions:
  contents: read

concurrency:
  group: verify-prebuilts
  cancel-in-progress: false

jobs:
  llvm-22-1-5-1:
    name: Verify llvm-22.1.5-1
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: verify
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 1b21cdd6e67bb24b73cb20dd522cafc1343e46e0
          path: src
          persist-credentials: false
      - name: Rebuild and compare
        working-directory: src
        env:
          VERIFY_DIR: ${{ github.workspace }}/verify
        run: bash "$VERIFY_DIR/.github/verify-prebuilts/verify.sh" llvm-22.1.5-1 llvm-22.1.5-1 llvm-22.1.6-1 llvm-22.1.7-1 llvm-22.1.7-2 llvm-22.1.8-1 llvm-21.1.8-10 llvm-23.1.0-rc1-1 llvm-23.1.0-1 llvm-22.1.8-2 llvm-23.1.0-2 llvm-23.1.0-3 llvm-23.1.0-4 llvm-23.1.2-1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: rebuilt-llvm-22.1.5-1
          path: src/release/
          if-no-files-found: ignore

  llvm-22-1-6-1:
    name: Verify llvm-22.1.6-1
    needs: llvm-22-1-5-1
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
