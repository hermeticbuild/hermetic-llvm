name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check root workspace
        uses: tamird/sty@567dbae64bee48b18bcf1c0e05755674132732fb
        with:
          audit-loads: true
          files: |
            platforms/common.bzl
            platforms/declare_platforms.bzl
            runtimes/glibc/glibc_dynamic_linker.bzl
            runtimes/glibc/libc_aware_target_triple.bzl
      - name: Check rules_cc example workspace
        uses: tamird/sty@567dbae64bee48b18bcf1c0e05755674132732fb
        with:
          working-directory: e2e/rules_cc
          artifact-name: sty-rules-cc
