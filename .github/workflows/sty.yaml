name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check root workspace
        uses: tamird/sty@10eab86f75ebadb0a611db0d702f7eb73aaa3a6c
        with:
          audit-loads: true
      - name: Check rules_cc example workspace
        uses: tamird/sty@10eab86f75ebadb0a611db0d702f7eb73aaa3a6c
        with:
          working-directory: e2e/rules_cc
          artifact-name: sty-rules-cc
