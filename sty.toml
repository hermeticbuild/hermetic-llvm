"3rd_party/gcc/libstdcxx/crossconfig.m4.bzl" = "3rd_party/gcc/libstdcxx/crossconfig.m4.bzli"
"3rd_party/gcc/libstdcxx/gcc_config_checks.bzl" = "3rd_party/gcc/libstdcxx/gcc_config_checks.bzli"
