[analysis]
strict-generic-narrowing = true

[type-interfaces]
"defs.bzl" = "defs.bzli"
"directory.bzl" = "directory.bzli"

[rules]
missing-parameter-annotation = "error"
missing-return-annotation = "error"
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
explicit-any = "error"
# exec_test forwards the supplied rule's unknown keyword signature.
non-static-type = "ignore"

[[stub-packages]]
manifest = "@bazel_skylib//:stubs.toml"
allow-unversioned = true
