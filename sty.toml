[type-interfaces]
"defs.bzl" = "defs.bzli"
"directory.bzl" = "directory.bzli"

[rules]
# exec_test forwards arbitrary keyword arguments to its supplied rule.
missing-parameter-annotation = "ignore"
missing-return-annotation = "error"
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
explicit-any = "error"
# Native Bazel declarations still contain gradual parameter and field types.
non-static-type = "ignore"
