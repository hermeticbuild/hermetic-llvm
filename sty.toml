"case_insensitive_vfs.bzl" = "case_insensitive_vfs.bzli"
"config/defs.bzl" = "config/defs.bzli"
"constraints/libc/libc_versions.bzl" = "constraints/libc/libc_versions.bzli"
"defs.bzl" = "defs.bzli"
"directory.bzl" = "directory.bzli"
"kernel/extension/kernel_helpers.bzl" = "kernel/extension/kernel_helpers.bzli"
