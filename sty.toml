[analysis]
require-valid-suppressions = true
strict-generic-narrowing = true

[type-interfaces]
"constraints/libc/libc_versions.bzl" = "constraints/libc/libc_versions.bzli"
"defs.bzl" = "defs.bzli"
"directory.bzl" = "directory.bzli"
"kernel/extension/kernel_helpers.bzl" = "kernel/extension/kernel_helpers.bzli"
"runtimes/glibc/glibc_stubs_assembly_files.bzl" = "runtimes/glibc/glibc_stubs_assembly_files.bzli"
"runtimes/module_map.bzl" = "runtimes/module_map.bzli"
"toolchain/llvm/llvm.bzl" = "toolchain/llvm/llvm.bzli"

[rules]
missing-parameter-annotation = "error"
missing-return-annotation = "error"
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
explicit-any = "error"
non-static-type = "error"
blanket-ignore-comment = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
division-by-zero = "error"

[[stub-packages]]
manifest = "@bazel_skylib//:stubs.toml"

[[stub-packages]]
manifest = "@rules_cc//:stubs.toml"
